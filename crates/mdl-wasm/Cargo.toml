[package]
name = "mdl-wasm"
version = "0.1.0"
edition = "2021"
description = "Client-side WASM module for receipt image compression, budget summary computation, and French Excel CSV export"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.128"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
ed25519-dalek = { version = "2.1", default-features = false, features = ["fast"] }
base64 = "0.22"
hex = "0.4"

[dev-dependencies]
ed25519-dalek = { version = "2.1", default-features = false, features = ["fast"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
