<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Logo MDL Connect">
  <defs>
    <linearGradient id="mdl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="65%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="mdl-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Full-bleed rounded badge (safe for both standard & maskable icons) -->
  <rect width="512" height="512" rx="112" fill="url(#mdl-bg)" />
  <rect width="512" height="256" rx="112" fill="url(#mdl-shine)" />

  <!-- Subtle outer ring inside maskable safe-zone -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="6" />

  <!-- Stylized connected M emblem -->
  <path
    d="M156 334V186L256 274L356 186V334"
    fill="none"
    stroke="#ffffff"
    stroke-width="34"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Connection nodes -->
  <circle cx="156" cy="186" r="20" fill="#ffffff" />
  <circle cx="356" cy="186" r="20" fill="#ffffff" />
  <circle cx="256" cy="274" r="20" fill="#67e8f9" stroke="#ffffff" stroke-width="8" />
  <circle cx="156" cy="334" r="16" fill="#ffffff" />
  <circle cx="356" cy="334" r="16" fill="#ffffff" />
</svg>
