<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="MDL Connect Logo">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="55%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
  </defs>

  <!-- Rounded squircle app icon -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" />
  <rect x="26" y="26" width="460" height="460" rx="110" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="4" />

  <!-- Architectural roof / maison des lycéens -->
  <path
    d="M124 236 L256 124 L388 236"
    fill="none"
    stroke="url(#roofGrad)"
    stroke-width="28"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Stylized 'M' pillars inside house -->
  <path
    d="M164 368 V246 L256 320 L348 246 V368"
    fill="none"
    stroke="#ffffff"
    stroke-width="28"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Student / collective spark node -->
  <circle cx="256" cy="204" r="24" fill="url(#accentGrad)" />
</svg>
